<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa CAN | Grupo Consupago</title>
<meta name="description" content="Tablero ejecutivo del Programa CAN (Crédito Asociado a la Nómina): objetivo, estructura de mesas, actividades, resumen semanal y timelines.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C355E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C355E'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%237BAAE0' stroke-width='4'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23E8561C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>

<header class="masthead">
<div class="wrap masthead__inner">
<div class="masthead__title">
<p class="brand"><span class="brand__dot" aria-hidden="true"></span>Grupo Consupago</p>
<h1>Programa CAN</h1>
</div>
<div class="masthead__meta">
<p>Información al <strong id="fecha-corte">—</strong><br>Consulta del <span id="fecha-hoy">—</span></p>
<button type="button" class="btn btn--ghost" id="btn-imprimir">Imprimir vista</button>
</div>
</div>
</header>

<div class="tabs-wrap">
<div class="wrap">
<div class="tabs" role="tablist" aria-label="Secciones del tablero">
<button type="button" class="tab" role="tab" id="tab-tablero" data-tab="tablero" aria-controls="panel-tablero" aria-selected="true">Tablero</button>
<button type="button" class="tab" role="tab" id="tab-semanal" data-tab="semanal" aria-controls="panel-semanal" aria-selected="false" tabindex="-1">Resumen semanal</button>
<button type="button" class="tab" role="tab" id="tab-actividades" data-tab="actividades" aria-controls="panel-actividades" aria-selected="false" tabindex="-1">Actividades</button>
<button type="button" class="tab" role="tab" id="tab-timeline" data-tab="timeline" aria-controls="panel-timeline" aria-selected="false" tabindex="-1">Timeline del proyecto</button>
<button type="button" class="tab" role="tab" id="tab-cecoban" data-tab="cecoban" aria-controls="panel-cecoban" aria-selected="false" tabindex="-1">Timeline CECOBAN</button>
<button type="button" class="tab" role="tab" id="tab-regulatorio" data-tab="regulatorio" aria-controls="panel-regulatorio" aria-selected="false" tabindex="-1">Regulatorio y auditoría</button>
</div>
</div>
</div>

<main id="contenido" class="wrap">

  <section class="panel" id="panel-tablero">
    <div class="hero">

      <div class="hero__text">
        <h2 class="hero__title">Crédito Asociado a la Nómina</h2>
        <p class="hero__objective" id="objetivo-programa"></p>
        <p class="hero__context" id="contexto-programa"></p>
      </div>

      <div class="countdown" id="countdown"></div>

      <div class="hero__rail">
        <div class="rail" id="rail"></div>
      </div>

    </div>
  </section>

</main>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
