<section class="panel-view">
    <header class="panel__head">
        <h2>Decisiones por mesa</h2>
        <p>
            Definiciones, acuerdos y decisiones identificadas durante las sesiones de trabajo.
        </p>
    </header>

    <!-- FILTRO MESA -->
    <div class="filters"
         role="group"
         aria-label="Filtrar por mesa"
         id="filtro-mesas">
        <button class="chip-btn active"
                data-mesa="todas">
            Todas
        </button>
        <button class="chip-btn"
                data-mesa="Mesa de Cumplimiento y Riesgo">
            Mesa de Cumplimiento y Riesgo
        </button>
        <button class="chip-btn"
                data-mesa="Mesa de Estrategia Comercial">
            Mesa de Estrategia Comercial
        </button>
        <button class="chip-btn"
                data-mesa="Mesa de Arquitectura y Tecnología">
            Mesa de Arquitectura y Tecnología
        </button>
    </div>

    <!-- FILTRO RESPONSABLE -->
        <div class="responsable-filter">    
        <label for="responsable-select">
            Responsable
        </label>    
        <select id="responsable-select">    
            <option value="todos">
                Todos
            </option>    
        </select>    
    </div>

    <!-- CONTADORES -->
    <ul class="counts">
        <li>
            <strong id="dec-pendientes">0</strong>
            pendientes
        </li>
        <li>
            <strong id="dec-realizadas">0</strong>
            realizadas
        </li>
    </ul>

    <!-- COLUMNAS -->
    <div class="cols">
        <section>
            <h3>Decisiones pendientes</h3>
            <ul class="acts"
                id="lista-pendientes">
            </ul>
        </section>
        <section>
            <h3>Decisiones realizadas</h3>
            <ul class="acts"
                id="lista-realizadas">
            </ul>
        </section>
    </div>
</section>
